# Ad Command Center. In the Netlify UI set this site's "Base directory" to: ad-command-center
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pg (the hourly feed's Postgres client) has optional native pieces esbuild cannot bundle: ship it from node_modules as is
  external_node_modules = ["pg"]

# API routes: the browser only ever talks to these functions; secrets stay in Netlify env
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Ops page (public/ops/index.html, PIN login via /api/ops-login)
[[redirects]]
  from = "/ops"
  to = "/ops/index.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npx vite --port 5173"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false
