<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>To do · BodyJ4You OS</title>
<style>
/* BodyJ4You OS look (DESIGN.md): light ground, white cards, 10px corners, system font, dark band. Colour only for status. */
:root { --ground:#eef1ef; --card:#fff; --ink:#14201f; --ink2:#5b6a69; --ink3:#687776; --line:#dde3e1; --band:#0f1a1e; --accent:#0e7c72;
  --bad:#b3261e; --warn:#8a5c10; --ok:#1f8a4c; --shadow:0 1px 2px rgba(15,26,30,.06),0 4px 14px rgba(15,26,30,.05); }
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.band{background:var(--band);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px}
.band a{color:#b8c7c5;text-decoration:none;font-size:13px}.band a:hover{color:#fff}
.band b{font-weight:600}.band .sp{margin-left:auto}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 80px}
.hero{display:flex;align-items:center;gap:18px;margin:6px 2px 22px}
.hero h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em}
.hero p{margin:6px 0 0;color:var(--ink2);font-size:14px}
.ring{transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:6}.ring .tr{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease-in-out}
.ring.pulse{animation:pulse .6s cubic-bezier(.2,.8,.2,1)}@keyframes pulse{50%{transform:rotate(-90deg) scale(1.08)}}
.week{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--ink3);font-size:12px}
.week i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);display:block}.week i.on{background:var(--accent);border-color:var(--accent)}.week i.now{border-color:var(--ink2)}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;transition:opacity .25s,max-height .3s,margin .3s,padding .3s;max-height:600px;overflow:hidden}
.card.gone{opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0}
.card.done .t{opacity:.45;text-decoration:line-through}
.t{font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.m{color:var(--ink2);font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.m .over{color:var(--bad);font-weight:600}.m .today{color:var(--warn);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.btn:hover{background:#f6f8f7}.btn:active{transform:scale(.98)}
.btn.p{background:var(--band);border-color:var(--band);color:#fff}.btn.p:hover{background:#1b2b30}
.btn.q{border-color:transparent;color:var(--ink2);font-weight:500}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:26px 2px 10px;font-weight:600}
.fold{width:100%;text-align:left;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:0 18px;min-height:48px;display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px}
.fold span{color:var(--ink2);font-weight:400}.fold:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .2s}
.fold.open:after{transform:rotate(-135deg)}
.row{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px 12px 18px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.row .x{flex:1;min-width:0}.row .t{font-size:14px;font-weight:500}.row .m{margin-top:3px;font-size:12px}
.row .btn{min-height:44px;padding:0 12px;font-size:13px;flex:none}
.note{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 18px;margin-bottom:18px;font-size:14px;display:flex;gap:10px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;transform:translateY(-1px)}
.calm{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:22px 18px;color:var(--ink2)}
.login{max-width:340px;margin:12vh auto 0;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:26px}
.login h1{font-size:20px;margin:0 0 6px}.login p{color:var(--ink2);margin:0 0 16px;font-size:14px}
.login input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:18px;letter-spacing:.2em;margin-bottom:12px}
.login .btn{width:100%}.msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--band);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.toast button{color:#fff;font-weight:600;text-decoration:underline;min-height:44px;padding:0 6px}
.tabs{display:inline-flex;background:#dfe5e3;border-radius:9px;padding:3px;gap:3px;margin:0 2px 18px}
.tabs button{min-height:44px;padding:0 16px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,26,30,.12)}
.tabs button span{font-weight:400;color:var(--ink3);margin-left:4px}
.card.busy{pointer-events:none;opacity:.6}
.row a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink2)}
.tabs{flex-wrap:wrap}
.band a{display:inline-flex;align-items:center;min-height:44px}
.foot{color:var(--ink3);font-size:12px;margin:26px 2px 0;line-height:1.6}
@media (max-width:560px){.hero h1{font-size:23px}.row{flex-wrap:wrap}.row .x{flex-basis:100%}.wrap{padding:18px 12px 80px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.num{width:26px;height:26px;border-radius:50%;background:var(--band);color:#fff;font-size:13px;font-weight:600;display:inline-grid;place-items:center;flex:none;margin-right:10px}
.card .top{display:flex;align-items:flex-start}
.card .d{color:var(--ink2);font-size:14px;margin:6px 0 0 36px;line-height:1.45}
.card .m{margin-left:36px}.card .acts{margin-left:36px}
.onit{color:var(--accent);font-weight:600}
.acts a.btn{display:inline-flex;align-items:center;text-decoration:none}
.log{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px;font-size:13px}
.log div{display:grid;grid-template-columns:118px 84px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink2)}
.log div:first-child{border-top:0}.log b{color:var(--ink);font-weight:600}
@media (max-width:560px){.card .d,.card .m,.card .acts{margin-left:0}.log div{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="band"><a href="https://bodyj4you-ceo-dashboard.netlify.app/">&larr; Back to OS</a><b>To do</b><span class="sp"></span><a href="#" id="out" hidden>Sign out</a></div>

<div class="login" id="login" hidden>
  <h1>To do</h1><p>What needs attention at each workstation: Operations, Catalog, Advertising. Sign in with your PIN.</p>
  <form id="lf"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN"><button class="btn p" type="submit">Sign in</button></form>
  <div class="msg" id="lmsg" role="alert"></div>
</div>

<div class="wrap" id="app" hidden>
  <div class="tabs" id="tabs"></div>
  <div class="hero"><div id="ring"></div><div><h1 id="head"></h1><p id="sub"></p><div class="week" id="week"></div></div></div>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* One shared list per workstation, the same for everyone who signs in: biggest first, On it / Done / Later / Not relevant.
   The PIN says who acted (shown on the task and in the log). Built after the Operations "Today" page. */
var S = { csrf: "", role: "operator", user: "", tasks: [], done: [], log: [], status: null }, open = {}, TOP = 5, TAB = null;
var STATIONS = [["operations", "Operations"], ["catalog", "Catalog"], ["advertising", "Advertising"], ["personal", "Personal"]];
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function safeUrl(u) { return /^https:\/\//i.test(u || "") ? u : ""; }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function shortDate(s) { var d = new Date(s + "T12:00:00"); return isNaN(d) ? "" : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
function when(iso) { var d = new Date(iso); if (isNaN(d)) return ""; return (ymd(d) === ymd(new Date()) ? "" : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " ") + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
function api(method, payload) {
  var o = { method: method, headers: { "content-type": "application/json", "x-csrf": S.csrf }, credentials: "same-origin", cache: "no-store" };
  if (payload) o.body = JSON.stringify(payload);
  return fetch("/api/desk", o).then(function (r) { return r.json().then(function (j) { j.status_code = r.status; return j; }); });
}
var tt = null;
function toast(msg, undo) {
  var t = $("toast"); t.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? "<button>Undo</button>" : ""); t.hidden = false;
  if (undo) t.querySelector("button").onclick = function () { t.hidden = true; undo(); };
  clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, undo ? 7000 : 3500);
}
function ring(frac, size, pulse) {
  var r = (size - 8) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return '<svg class="ring' + (pulse ? " pulse" : "") + '" width="' + size + '" height="' + size + '"><circle class="tr" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '"/><circle class="fg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - f)).toFixed(1) + '"/></svg>';
}
function tabOf(t) { return t.tab === "personal" ? "personal" : (t.station || "catalog"); }
function inTab(t) { return tabOf(t) === TAB; }
function shared(t) { return t.audience === "operator"; }
/* biggest first (rank = dollars a day at stake where the check knows it), then the emptiest stock, "N more" lines last */
function order(a, b) {
  var more = function (t) { return /^\d+ more /.test(t.text) ? 1 : 0; }, due = function (t) { return t.due || "9999"; };
  return more(a) - more(b) || (+b.rank || 0) - (+a.rank || 0) || (due(a) < due(b) ? -1 : due(a) > due(b) ? 1 : 0) || (a.text < b.text ? -1 : a.text > b.text ? 1 : 0);
}
function dueHtml(t) {
  if (!t.due) return ""; var td = ymd(new Date());
  if (t.due < td) return '<span class="over">Overdue since ' + shortDate(t.due) + "</span>";
  if (t.due === td) return '<span class="today">Due today</span>';
  return "<span>Due " + shortDate(t.due) + "</span>";
}
function meta(t) {
  var bits = dueHtml(t) + (t.state === "doing" ? '<span class="onit">' + esc(t.actor || "Someone") + " is on it" + (t.state_at ? " · since " + esc(when(t.state_at)) : "") + "</span>" : "") +
    (t.project_name ? "<span>" + esc(t.project_name) + "</span>" : "") + (t.mentions > 1 ? "<span>Came up in " + t.mentions + " sessions</span>" : "");
  return bits ? '<div class="m">' + bits + "</div>" : "";
}
function buttons(t, small) {
  var u = safeUrl(t.link), c = small ? "btn q" : "btn";
  return (t.state === "doing" ? "" : '<button class="btn' + (small ? "" : " p") + '" data-act="doing">On it</button>') +
    '<button class="btn' + (t.state === "doing" && !small ? " p" : "") + '" data-act="done">Done</button>' +
    '<button class="' + c + '" data-act="later" title="Hide for 7 days">Later</button>' +
    (small ? "" : '<button class="btn q" data-act="move" title="Take it off the list for good">Not relevant</button>') +
    (u ? '<a class="btn q" href="' + esc(u) + '" target="_blank" rel="noopener">Open &rarr;</a>' : "");
}
function card(t, n) {
  return '<div class="card" data-key="' + esc(t.key) + '"><div class="top"><span class="num">' + n + '</span><div class="t">' + esc(t.text) + "</div></div>" +
    (t.detail ? '<div class="d">' + esc(t.detail) + "</div>" : "") + meta(t) + '<div class="acts">' + buttons(t) + "</div></div>";
}
function row(t) {
  return '<div class="row card" data-key="' + esc(t.key) + '"><div class="x"><div class="t">' + esc(t.text) + "</div>" + (t.detail ? '<div class="m"><span>' + esc(t.detail) + "</span></div>" : "") + meta(t) + "</div>" + buttons(t, true) + "</div>";
}
function doneToday() { var td = ymd(new Date()); return S.done.filter(function (d) { return inTab(d) && (TAB === "personal" || shared(d)) && d.done_at && ymd(new Date(d.done_at)) === td; }); }
function render(pulse) {
  var owner = S.role === "owner", personal = TAB === "personal";
  var mineOnly = S.tasks.filter(function (t) { return inTab(t) && !shared(t); }).sort(order);            /* owner PIN only: notes from his own sessions */
  var main = (personal ? mineOnly : S.tasks.filter(function (t) { return inTab(t) && shared(t); })).sort(order);
  var top = main.slice(0, TOP), rest = main.slice(TOP), dt = doneToday(), total = dt.length + main.length;
  var name = (STATIONS.filter(function (x) { return x[0] === TAB; })[0] || ["", ""])[1];
  $("tabs").innerHTML = STATIONS.filter(function (x) { return x[0] !== "personal" || owner; }).map(function (x) {
    var n = S.tasks.filter(function (t) { return tabOf(t) === x[0] && (x[0] === "personal" || shared(t)); }).length;
    return '<button data-tab="' + x[0] + '" class="' + (TAB === x[0] ? "on" : "") + '">' + x[1] + "<span>" + n + "</span></button>";
  }).join("");
  $("ring").innerHTML = ring(total ? dt.length / total : 1, 72, pulse);
  $("head").textContent = main.length ? main.length + (main.length === 1 ? " thing needs attention in " : " things need attention in ") + name : name + ": all clear";
  $("sub").textContent = (total ? dt.length + " of " + total + " done today" : "Nothing open") + (main.length ? " · biggest first" : "");
  var now = new Date(), dow = (now.getDay() + 6) % 7, days = {}, names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], w = "";
  S.done.forEach(function (d) { if (inTab(d) && d.done_at) days[ymd(new Date(d.done_at))] = 1; });
  for (var i = 0; i < 7; i++) { var dd = ymd(new Date(now.getTime() + (i - dow) * 864e5)); w += '<i class="' + (days[dd] ? "on" : "") + (i === dow ? " now" : "") + '" title="' + names[i] + (days[dd] ? ": something done" : "") + '"></i>'; }
  $("week").innerHTML = w + "<span>this week</span>";
  var h = "", fold = function (id, title, list, fn, note) {
    if (!list.length) return;
    h += '<button class="fold' + (open[id] ? " open" : "") + '" data-fold="' + id + '">' + title + " <span>" + list.length + (note ? " · " + note : "") + "</span></button>" + (open[id] ? list.map(fn).join("") : "");
  };
  h += top.length ? "<h2>Do these today</h2>" + top.map(function (t, n) { return card(t, n + 1); }).join("") : '<div class="calm">Nothing needs attention here right now. New items show up as the daily checks find them.</div>';
  fold("rest", "Also open", rest, row);
  if (owner && !personal) fold("mine", "From your work sessions", mineOnly, row, "only your PIN sees these");
  fold("done", "Done today", dt, function (d) { return '<div class="row"><div class="x"><div class="t" style="opacity:.6">' + esc(d.text) + '</div><div class="m"><span>' + esc(d.actor || "") + (d.done_at ? " · " + esc(when(d.done_at)) : "") + '</span></div></div><button class="btn q" data-undo="' + esc(d.key) + '">Put back</button></div>'; });
  var WORD = { todo_doing: "On it", todo_done: "Done", todo_later: "Later", todo_move: "Not relevant", todo_undo: "Put back" };
  var lines = (S.log || []).filter(function (l) { var it = String(l.item || ""); return personal ? it === "owner:personal" : (it === TAB || it === "owner:" + TAB); });
  if (lines.length) h += '<button class="fold' + (open.log ? " open" : "") + '" data-fold="log">Who did what <span>' + lines.length + "</span></button>" + (open.log ? '<div class="log">' + lines.map(function (l) {
    return "<div><span>" + esc(when(l.at)) + "</span><b>" + esc(l.user_name || "") + "</b><span><b>" + (WORD[l.action] || esc(l.action)) + "</b> · " + esc(l.detail || "") + "</span></div>"; }).join("") + "</div>" : "");
  $("list").innerHTML = h;
  var at = S.status && S.status.at ? new Date(S.status.at) : null, mins = at ? Math.round((Date.now() - at) / 60000) : null;
  $("foot").textContent = "Signed in as " + S.user + ". The list comes from the daily checks: account health, suppressed listings, ads, stock. " +
    (mins == null ? "" : mins > 90 ? "Not refreshed for " + Math.round(mins / 60) + " hours: the Mac that runs the checks may be asleep." : "Refreshed " + (mins < 2 ? "just now" : mins + " minutes ago") + ".");
}
function load(pulse) {
  return api("GET").then(function (j) {
    if (j.status_code === 401) { S.tasks = []; S.done = []; S.log = []; $("list").innerHTML = ""; $("app").hidden = true; $("out").hidden = true; $("login").hidden = false; $("pin").focus(); return; }
    if (!j.ok) { if (!$("app").hidden) return toast(j.error || "The list could not be refreshed."); $("login").hidden = false; $("lmsg").textContent = j.error || "The list could not be opened."; return; }
    S = { csrf: j.csrf, role: j.role || "operator", user: j.user || "", tasks: j.tasks || [], done: j.done || [], log: j.log || [], status: j.status };
    if (!TAB) {      /* first open: the tab named in the link (#catalog), else the first workstation with something in it */
      var want = location.hash.replace("#", ""), has = function (id) { return S.tasks.some(function (t) { return tabOf(t) === id && shared(t); }); };
      TAB = STATIONS.some(function (x) { return x[0] === want && (want !== "personal" || S.role === "owner"); }) ? want : (STATIONS.filter(function (x) { return x[0] !== "personal" && has(x[0]); })[0] || STATIONS[0])[0];
    }
    $("login").hidden = true; $("app").hidden = false; $("out").hidden = false; render(pulse);
  }).catch(function () { if (!$("app").hidden) return toast("No connection. Showing the last list."); $("login").hidden = false; $("lmsg").textContent = "No connection. Try again."; });
}
function act(key, action, el) {
  var left = S.tasks.filter(function (t) { return inTab(t) && (TAB === "personal" || shared(t)); }).length, leaves = action !== "doing" && action !== "undo";
  if (el) { if (el.classList.contains("busy")) return; el.classList.add("busy"); if (action === "done") el.classList.add("done"); if (leaves) setTimeout(function () { el.classList.add("gone"); }, action === "done" ? 450 : 0); }
  api("POST", { key: key, action: action }).then(function (j) {
    if (!j.ok) { toast(j.error || "That could not be saved."); return load(); }
    setTimeout(function () {
      load(action === "done" && left === 1).then(function () {
        toast({ doing: "Marked: you are on it.", done: "Done.", later: "Hidden for 7 days.", move: "Taken off the list.", undo: "Back on the list." }[action], action === "undo" ? null : function () { act(key, "undo"); });
      });
    }, el && leaves ? 500 : 0);
  }).catch(function () { toast("No connection. Nothing was saved."); load(); });
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act],[data-undo],[data-fold],[data-tab]"); if (!b) return;
  if (b.dataset.tab) { TAB = b.dataset.tab; open = {}; history.replaceState(null, "", "#" + TAB); return render(); }
  if (b.dataset.fold) { open[b.dataset.fold] = !open[b.dataset.fold]; return render(); }
  if (b.dataset.undo) return act(b.dataset.undo, "undo");
  var c = b.closest("[data-key]"); act(c.dataset.key, b.dataset.act, c);
});
$("lf").addEventListener("submit", function (e) {
  e.preventDefault(); $("lmsg").textContent = "";
  fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ pin: $("pin").value }) })
    .then(function (r) { return r.json(); }).then(function (j) { $("pin").value = ""; if (!j.ok) { $("lmsg").textContent = j.error || "Wrong PIN."; return; } load(); })
    .catch(function () { $("lmsg").textContent = "No connection. Try again."; });
});
$("out").addEventListener("click", function (e) {
  e.preventDefault();
  fetch("/api/logout", { method: "POST", headers: { "content-type": "application/json", "x-csrf": S.csrf }, credentials: "same-origin", body: JSON.stringify({ csrf: S.csrf }) }).then(function () { location.reload(); });
});
document.addEventListener("visibilitychange", function () { if (!document.hidden && !$("app").hidden) load(); });
load();
</script>
</body>
</html>
